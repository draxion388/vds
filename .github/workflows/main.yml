name: Acil RDP
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Ngrok Kurulumu
      run: |
        Invoke-WebRequest https://equinox.io -OutFile ngrok.zip
        Expand-Archive ngrok.zip
    - name: Ngrok Kimlik Doğrulama
      run: .\ngrok\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: RDP Aktif Etme
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: RDP Baglantisini Baslat
      run: Start-Process .\ngrok\ngrok.exe -ArgumentList "tcp 3389"
    - name: Baglanti Bilgilerini Al ve Sunucuyu Acik Tut
      run: |
        $NgrokUrl = (Invoke-WebRequest -Uri http://127.0.0 | ConvertFrom-Json).tunnels[0].public_url
        Write-Host "Uzak Masaustu Adresi: $NgrokUrl"
        Write-Host "Kullanici Adi: runneradmin"
        Write-Host "Sifre: GitHub otomatik sifresidir, kendiniz belirlemek isterseniz asagiya sifre ekleme kodu yazabilirsiniz."
        Start-Sleep -Seconds 21600
